<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pago no completado | ServContable PRO</title>
    <meta name="description" content="Pago no completado ServContable PRO." />
    <link rel="icon" href="./assets/servcontable-logo.png" />
    <link rel="stylesheet" href="./styles.css?v=20" />
  </head>
  <body>
    <main class="payment-result-page" data-payment-result="error">
      <section class="payment-result-card error">
        <img src="./assets/servcontable-logo.png" alt="ServContable PRO" />
        <span class="plan-label">Pago no completado</span>
        <h1>No pudimos completar el pago</h1>
        <p>
          No se realizó ningún cobro confirmado. Puedes intentar nuevamente con
          la misma modalidad o volver a elegir tu contratación.
        </p>

        <div class="result-grid">
          <div><span>Número de solicitud</span><strong data-result-id>-</strong></div>
          <div><span>Plan</span><strong data-result-plan>-</strong></div>
          <div><span>Monto</span><strong data-result-amount>-</strong></div>
          <div><span>Estado</span><strong data-result-status>No completado</strong></div>
        </div>

        <div class="payment-result-actions">
          <a class="button button-primary" href="./index.html#contratar">Volver a intentar</a>
          <a class="button button-secondary" href="./index.html">Volver a la web</a>
        </div>
      </section>
    </main>
    <script src="./script.js?v=20"></script>
  </body>
</html>
